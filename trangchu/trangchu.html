  <!-- Header chính -->
  <header class="header">
    <div class="logo">
      <img src="/images/trangchu/logo.png" alt="N6 Logo">
      <h2>NHÀ SÁCH N6</h2>
    </div>
    <div class="search-bar">
      <select>
        <option>Tất cả</option>
        <option>Văn phòng phẩm</option>
        <option>Đồ dùng học sinh</option>
        <option>Máy tính Canon</option>
        <option>Máy tính Casio</option>
        <option>Bút bi - bút chì - tẩy</option>
        <option>Vở học sinh</option>
      </select>
      <form action="#" method="get">
        <input type="text" placeholder="Tìm kiếm sản phẩm...">
        <button type="submit"><i class="fa fa-search"></i></button>
      </form>
      
    </div>
    <div class="right-actions">
      <div class="hotline">
        <i class="fa fa-phone"></i>
        <p>Gọi đặt hàng<br><strong>024.2246.2003</strong></p>
      </div>
      <div class="cart">
        <i class="fa fa-shopping-cart"></i>
        <p>Giỏ hàng<br><strong>(0) sản phẩm</strong></p>
      </div>
    </div>
  </header>

  <!-- Thanh menu -->
  <nav>
    <ul>
      <li><a href="#"><i class="fa fa-pen"></i> Văn phòng phẩm</a></li>

      <li><a href="#"><i class="fa fa-newspaper"></i> Tin tức</a></li>
      <li><a href="#"><i class="fa fa-address-card"></i> Liên hệ</a></li>
    </ul>
  </nav>

  <main class="main">
    <div class="banner-container">
      <div class="banner-slides" id="slides">
        <div class="banner-slide"><img src="/images//trangchu/banner1.webp" alt="Ảnh 1"></div>
        <div class="banner-slide"><img src="/images/trangchu/banner2.png" alt="Ảnh 2"></div>
        <div class="banner-slide"><img src="/images/trangchu/banner3.png" alt="Ảnh 3"></div>
      </div>
    </div>

    <div class="dots">
      <span class="dot active" onclick="showSlide(0)"></span>
      <span class="dot" onclick="showSlide(1)"></span>
      <span class="dot" onclick="showSlide(2)"></span>
    </div>
